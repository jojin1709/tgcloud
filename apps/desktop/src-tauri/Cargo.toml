[package]
name = "tgcloud-desktop"
version = "1.0.0"
description = "TGCloud - Telegram-backed Personal Cloud Storage"
authors = ["TGCloud Team"]
edition = "2021"

[lib]
name = "tgcloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
grammers-client = "0.11"
grammers-session = { version = "0.11", default-features = false, features = ["serde"] }
grammers-tl-types = "0.11"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2.0"
open = "5.3"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
futures-util = "0.3"
parking_lot = "0.12"
rfd = "0.15"
