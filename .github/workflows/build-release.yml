name: Build & Release TGCloud

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Generate Android Embedding Scaffolding
        run: |
          cd apps/mobile
          flutter create --org com.tgcloud --project-name tgcloud_mobile --platforms android .

      - name: Configure Android Gradle (compileSdk 35) & Intent Filters
        run: |
          python3 -c "
          import re
          # 1. Update compileSdk to 35
          gradle_path = 'apps/mobile/android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              gradle_text = f.read()
          gradle_text = re.sub(r'compileSdk\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 35', gradle_text)
          gradle_text = re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk = 35', gradle_text)
          gradle_text = re.sub(r'compileSdkVersion\s*flutter\.compileSdkVersion', 'compileSdkVersion 35', gradle_text)
          gradle_text = re.sub(r'compileSdkVersion\s*\d+', 'compileSdkVersion 35', gradle_text)
          with open(gradle_path, 'w') as f:
              f.write(gradle_text)

          # 2. Update AndroidManifest.xml: remove deprecated package attribute and inject Share Sheet intent-filters
          manifest_path = 'apps/mobile/android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              manifest_text = f.read()
          manifest_text = re.sub(r'\s*package=\"[^\"]*\"', '', manifest_text)
          share_filter = '''
                  <!-- Gallery Share Sheet Receiver -->
                  <intent-filter>
                      <action android:name=\"android.intent.action.SEND\" />
                      <category android:name=\"android.intent.category.DEFAULT\" />
                      <data android:mimeType=\"*/*\" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name=\"android.intent.action.SEND_MULTIPLE\" />
                      <category android:name=\"android.intent.category.DEFAULT\" />
                      <data android:mimeType=\"*/*\" />
                  </intent-filter>
          '''
          if '<intent-filter>' in manifest_text and 'android.intent.action.SEND' not in manifest_text:
              manifest_text = manifest_text.replace('</activity>', share_filter + '        </activity>')
          with open(manifest_path, 'w') as f:
              f.write(manifest_text)
          "

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Run Mobile Unit Tests
        run: |
          cd apps/mobile
          flutter test test/unit_test.dart

      - name: Build Android Release APK
        run: |
          cd apps/mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgcloud-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Desktop (Inno Setup & Portable EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Desktop Web Frontend
        shell: bash
        run: |
          cd apps/desktop
          npm install
          npm run build

      - name: Run Backend Tests
        shell: bash
        run: |
          cd apps/desktop/src-tauri
          cargo test

      - name: Build Desktop Release Binary
        shell: bash
        run: |
          cd apps/desktop/src-tauri
          cargo build --release

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Compiling with Inno Setup: $iscc"
          New-Item -ItemType Directory -Path "./release-assets" -Force
          & $iscc ./installer/tgcloud-setup.iss

      - name: Copy Portable Executable
        shell: pwsh
        run: |
          Copy-Item "./apps/desktop/src-tauri/target/release/tgcloud-desktop.exe" -Destination "./release-assets/TGCloud-Windows.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgcloud-windows-assets
          path: ./release-assets/*

  publish-release:
    name: Publish Release Assets
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: tgcloud-android-apk
          path: ./release-files

      - name: Download Windows Assets
        uses: actions/download-artifact@v4
        with:
          name: tgcloud-windows-assets
          path: ./release-files

      - name: Prepare Final Release Assets
        run: |
          ls -la ./release-files
          mv ./release-files/app-release.apk ./release-files/TGCloud-Android.apk || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-files/TGCloud-Setup-v1.0.0.exe
            ./release-files/TGCloud-Windows.exe
            ./release-files/TGCloud-Android.apk
          name: "TGCloud v1.0.0 — Production Release"
          body: |
            # TGCloud v1.0.0 Production Release
            **Engineered and Developed by [JOJIN JOHN](https://www.linkedin.com/in/jojin-john/)**
            
            ### Included Downloads:
            - **Windows Setup Installer (Inno Setup)**: `TGCloud-Setup-v1.0.0.exe` (Recommended for Windows)
            - **Windows Standalone Portable Executable**: `TGCloud-Windows.exe`
            - **Android Mobile Application**: `TGCloud-Android.apk`
            
            ### Quick Start:
            1. Download the installer or APK for your platform.
            2. Launch and log in with your Telegram phone number and verification code.
            3. Enjoy sovereign, high-speed, direct MTProto cloud storage with zero middleman servers!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
