name: Build & Release TGCloud

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Rust MTProto Engine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "Selected NDK: $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Web Frontend
        run: |
          cd apps/desktop
          npm install
          npm run build

      - name: Initialize Tauri Android Scaffolding
        run: |
          cd apps/desktop
          npx tauri android init --ci

      - name: Configure Android Permissions & Manifest
        run: |
          python3 -c "
          import os, re
          manifest_path = 'apps/desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  text = f.read()
              perms = '''
                  <uses-permission android:name=\"android.permission.INTERNET\" />
                  <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
                  <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
                  <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
              '''
              if '<uses-permission android:name=\"android.permission.INTERNET\"' not in text:
                  text = text.replace('<application', perms + '    <application')
                  with open(manifest_path, 'w') as f:
                      f.write(text)
          "

      - name: Build Android Release APK
        run: |
          cd apps/desktop
          npx tauri android build --apk --target aarch64 --ci

      - name: Cryptographically Sign Android APK
        run: |
          # Generate signing keystore
          keytool -genkey -v -keystore release.jks -alias tgcloud -keyalg RSA -keysize 2048 -validity 10000 -storepass tgcloudpass -keypass tgcloudpass -dname "CN=TGCloud, OU=Dev, O=TGCloud, L=City, S=State, C=US"
          
          # Find generated APK
          RAW_APK=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK: $RAW_APK"
          
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          
          mkdir -p android-output
          if [ -n "$RAW_APK" ]; then
            $APKSIGNER sign --ks release.jks --ks-pass pass:tgcloudpass --key-pass pass:tgcloudpass --out android-output/TGCloud-Android.apk "$RAW_APK" || cp "$RAW_APK" android-output/TGCloud-Android.apk
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgcloud-android-apk
          path: android-output/TGCloud-Android.apk

  build-windows:
    name: Build Windows Desktop (Inno Setup & Portable EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Desktop Web Frontend
        shell: bash
        run: |
          cd apps/desktop
          npm install
          npm run build

      - name: Run Backend Tests
        shell: bash
        run: |
          cd apps/desktop/src-tauri
          cargo test

      - name: Build Desktop Release Binary (Embedded Frontend)
        shell: bash
        run: |
          cd apps/desktop
          npx tauri build --no-bundle

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Compiling with Inno Setup: $iscc"
          New-Item -ItemType Directory -Path "./release-assets" -Force
          & $iscc ./installer/tgcloud-setup.iss

      - name: Copy Portable Executable
        shell: pwsh
        run: |
          Copy-Item "./apps/desktop/src-tauri/target/release/tgcloud-desktop.exe" -Destination "./release-assets/TGCloud-Windows.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgcloud-windows-assets
          path: ./release-assets/*

  publish-release:
    name: Publish Release Assets
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: tgcloud-android-apk
          path: ./release-files

      - name: Download Windows Assets
        uses: actions/download-artifact@v4
        with:
          name: tgcloud-windows-assets
          path: ./release-files

      - name: Prepare Final Release Assets
        run: |
          ls -la ./release-files
          mv ./release-files/app-release.apk ./release-files/TGCloud-Android.apk || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          files: |
            ./release-files/TGCloud-Setup-v1.0.0.exe
            ./release-files/TGCloud-Windows.exe
            ./release-files/TGCloud-Android.apk
          name: "TGCloud v1.0.0 — Production Release"
          body: |
            # TGCloud v1.0.0 Production Release
            **Engineered and Developed by [JOJIN JOHN](https://www.linkedin.com/in/jojin-john/)**
            
            ### Included Downloads:
            - **Windows Setup Installer (Inno Setup)**: `TGCloud-Setup-v1.0.0.exe` (Recommended for Windows)
            - **Windows Standalone Portable Executable**: `TGCloud-Windows.exe`
            - **Android Mobile Application**: `TGCloud-Android.apk`
            
            ### Quick Start:
            1. Download the installer or APK for your platform.
            2. Launch and log in with your Telegram phone number and verification code.
            3. Enjoy sovereign, high-speed, direct MTProto cloud storage with zero middleman servers!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
