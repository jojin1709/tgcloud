name: Build & Release TGCloud

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Run Mobile Unit Tests
        run: |
          cd apps/mobile
          flutter test test/unit_test.dart

      - name: Build Android Release APK
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgcloud-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Desktop Web Frontend
        run: |
          cd apps/desktop
          npm install
          npm run build

      - name: Run Backend Tests
        run: |
          cd apps/desktop/src-tauri
          cargo test

      - name: Build Desktop Release Binary
        run: |
          cd apps/desktop/src-tauri
          cargo build --release

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgcloud-windows-exe
          path: apps/desktop/src-tauri/target/release/tgcloud-desktop.exe

  publish-release:
    name: Publish Release Assets
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: tgcloud-android-apk
          path: ./release-assets

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: tgcloud-windows-exe
          path: ./release-assets

      - name: Rename Release Binaries
        run: |
          mv ./release-assets/app-release.apk ./release-assets/TGCloud-Android.apk || true
          mv ./release-assets/tgcloud-desktop.exe ./release-assets/TGCloud-Windows.exe || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/TGCloud-Android.apk
            ./release-assets/TGCloud-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
