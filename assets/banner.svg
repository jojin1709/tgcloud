<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1621" />
      <stop offset="50%" stop-color="#17212b" />
      <stop offset="100%" stop-color="#0f1926" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ca5e0" />
      <stop offset="100%" stop-color="#1d7ac2" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ca5e0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2ca5e0" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#232e3c" stroke-width="0.7" stroke-dasharray="4 8" opacity="0.6"/>
  <path d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360" stroke="#232e3c" stroke-width="0.7" stroke-dasharray="4 8" opacity="0.6"/>

  <!-- Glow Background Behind Icon -->
  <circle cx="190" cy="180" r="130" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Brand Cloud Icon -->
  <g transform="translate(110, 100)">
    <rect width="160" height="160" rx="36" fill="#1e2c3a" stroke="#2ca5e0" stroke-width="2"/>
    <path d="M115 100H48C37.5 100 29 91.5 29 81C29 70.9 36.8 62.6 46.8 61.9C49.8 49 61.3 39.5 75.3 39.5C92 39.5 105.7 52.6 107.1 69C115.3 70.5 121.6 77.7 121.6 86.3C121.6 94 115.4 100 115 100Z" fill="url(#accentGrad)"/>
    <path d="M61 84L78 67L95 84M78 70V110" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(320, 115)">
    <!-- Title -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      TGCloud
    </text>
    
    <!-- Tagline Badge -->
    <rect x="225" y="4" width="230" height="34" rx="8" fill="#243447" stroke="#2ca5e0" stroke-width="1.2"/>
    <text x="242" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2ca5e0">
      TELEGRAM MTPROTO CLOUD
    </text>

    <!-- Subtitle -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9db2c7">
      Sovereign Personal Cloud Storage &amp; File Manager for Windows &amp; Android
    </text>

    <!-- Highlights -->
    <g transform="translate(0, 125)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="30" rx="6" fill="#1b2734" stroke="#2f4155" stroke-width="1"/>
      <circle cx="15" cy="15" r="4" fill="#2ca5e0"/>
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#d1e3f6">Direct MTProto TLS</text>

      <!-- Pill 2 -->
      <rect x="178" y="0" width="160" height="30" rx="6" fill="#1b2734" stroke="#2f4155" stroke-width="1"/>
      <circle cx="193" cy="15" r="4" fill="#00c853"/>
      <text x="206" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#d1e3f6">Zero Middleman Proxy</text>

      <!-- Pill 3 -->
      <rect x="351" y="0" width="170" height="30" rx="6" fill="#1b2734" stroke="#2f4155" stroke-width="1"/>
      <circle cx="366" cy="15" r="4" fill="#ffab00"/>
      <text x="379" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#d1e3f6">Tauri + Rust &amp; Flutter</text>

      <!-- Pill 4: Developer -->
      <rect x="534" y="0" width="195" height="30" rx="6" fill="#1b2734" stroke="#2ca5e0" stroke-width="1"/>
      <circle cx="549" cy="15" r="4" fill="#2ca5e0"/>
      <text x="562" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2ca5e0">Dev: JOJIN JOHN</text>
    </g>
  </g>
</svg>
